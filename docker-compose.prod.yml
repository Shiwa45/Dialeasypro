version: '3.9'

services:
  # ---- Redis for cache, broker, and channels -------------------
  redis:
    image: redis:7-alpine
    container_name: telecrm_redis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    # Only this server may reach Redis. Published on 0.0.0.0 it was open to
    # the whole internet, guarded by nothing but its password. The app's
    # containers reach it by name over the Docker network, not this port.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telecrm_network

  # ---- Django Web Application (Gunicorn ASGI) ------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: telecrm_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - REDIS_HOST=redis
      - DB_SSLMODE=${DB_SSLMODE:-prefer}
      - PGSSLMODE=${DB_SSLMODE:-prefer}
    # nginx on this server proxies to 127.0.0.1:8000. Published on 0.0.0.0
    # the app was also reachable directly on :8000, around nginx and HTTPS.
    ports:
      - "127.0.0.1:8000:8000"
    # Workers: each runs one Django request at a time, so 4 meant that four
    # slow requests (a report, an export) stalled everyone. 6 fits this
    # server (4 vCPU, 8 GB; ~120 MB each). --max-requests recycles a worker
    # now and then so memory cannot creep up over days.
    command: >
      gunicorn config.asgi:application
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers ${WEB_WORKERS:-6}
      --timeout 120
      --graceful-timeout 30
      --max-requests 2000
      --max-requests-jitter 200
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./mediafiles:/app/mediafiles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - telecrm_network

  # ---- Celery Worker -------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: telecrm_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - REDIS_HOST=redis
      - DB_SSLMODE=${DB_SSLMODE:-prefer}
      - PGSSLMODE=${DB_SSLMODE:-prefer}
    command: >
      celery -A config.celery worker
      --loglevel=info
      --concurrency=4
      -Q default,bulk_ops,notifications,integrations,call_uploads
      --hostname=worker@%h
    volumes:
      - ./mediafiles:/app/mediafiles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - telecrm_network

  # ---- Celery Beat ---------------------------------------------
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: telecrm_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - REDIS_HOST=redis
      - DB_SSLMODE=${DB_SSLMODE:-prefer}
      - PGSSLMODE=${DB_SSLMODE:-prefer}
    command: >
      celery -A config.celery beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - telecrm_network

volumes:
  redis_data:
    driver: local

networks:
  telecrm_network:
    driver: bridge
