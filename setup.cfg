# ============================================================
# TeleCRM Backend — setup.cfg
# ============================================================

[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.testing
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --cov=apps
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70
    -p no:warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    */migrations/*,
    venv,
    .venv,
    staticfiles,
    mediafiles,
    htmlcov
ignore = E203, E501, W503, W504
per-file-ignores =
    # Allow star imports in __init__.py
    */__init__.py: F401, F403
    # Allow longer lines in settings
    config/settings/*.py: E501

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
line_length = 100
skip = migrations, .venv, venv, staticfiles
known_django = django
known_third_party = rest_framework, celery, redis, boto3
known_first_party = apps, config
sections = FUTURE, STDLIB, DJANGO, THIRDPARTY, FIRSTPARTY, LOCALFOLDER

[mypy]
python_version = 3.12
ignore_missing_imports = True
plugins = mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = config.settings.development
